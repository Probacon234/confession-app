kind = "web"
previewPath = "/"
title = "CONFESSIONMIIT"
description = "A social media app that allows users to anonymously share confessions and personal feelings, browse public posts, and interact through likes and comments, offering a login portal and Google login option.。"
version = "1.0.0"
id = "artifacts/confession-community"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20744

[services.development]
run = "pnpm --filter @workspace/confession-community run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/confession-community", "run", "build" ]
serve = "static"
publicDir = "artifacts/confession-community/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20744"
BASE_PATH = "/"
